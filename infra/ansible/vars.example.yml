# ======================================================================
# 初始化参数：跑之前必填三项（标 🔴）。其余按需改。
# ======================================================================

# 🔴 管理员账号名（不是 root；三云通用）
admin_user: devops

# 🔴 你的 ed25519 公钥（本地生成方法见 README「密钥准备」；一行完整 ssh-ed25519 ...）
admin_pubkey: "ssh-ed25519 AAAA... replace-me"

# 🔴 你的域名（已把 A 记录指到本服务器公网 IP）
domain: clinic.example.com

# SSH 端口保持 22（云安全组按 22/80/443 放行即可；改端口要连安全组一起改）
ssh_port: 22
