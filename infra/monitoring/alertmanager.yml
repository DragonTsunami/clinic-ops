# Alertmanager → ai-bot webhook（P3 AI 分诊的入口；P2 阶段先对接本地 TG 转发）
# 路由语义：P1 立即发；P2 聚合 30 分钟发一次摘要，防轰炸
route:
  receiver: ai-bot
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="P2"]
      receiver: ai-bot
      group_wait: 30m
      repeat_interval: 24h

receivers:
  - name: ai-bot
    webhook_configs:
      # ai-bot 在 clinic-net 网络里，容器名即地址（P3 起由它调 LLM 分诊后推 TG）
      - url: http://ai-bot:9500/alert
        send_resolved: true
