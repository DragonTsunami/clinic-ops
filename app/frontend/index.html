<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>青衫诊所 · 预约挂号</title>
    <style>
      :root {
        --blue: #0f6fde;
        --bg: #f5f8fc;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: var(--bg); color: var(--text);
      }
      header {
        background: linear-gradient(90deg, #0f6fde, #3b9dff);
        color: #fff; padding: 14px 20px;
        display: flex; justify-content: space-between; align-items: center;
      }
      header .brand { font-size: 18px; font-weight: 600; }
      header .user { font-size: 13px; opacity: .9; cursor: pointer; }
      main { max-width: 860px; margin: 20px auto; padding: 0 16px; }
      .card {
        background: var(--card); border: 1px solid var(--line);
        border-radius: 10px; padding: 18px; margin-bottom: 14px;
      }
      h2 { font-size: 16px; margin-bottom: 12px; }
      .dept-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
      .dept-tabs button {
        padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px;
        background: #fff; cursor: pointer; font-size: 13px;
      }
      .dept-tabs button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
      .slot-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 9px 4px; border-bottom: 1px dashed var(--line); font-size: 14px;
      }
      .slot-row:last-child { border-bottom: none; }
      .btn {
        border: none; border-radius: 7px; padding: 7px 16px; cursor: pointer;
        background: var(--blue); color: #fff; font-size: 13px;
      }
      .btn:disabled { background: #c7d2e3; cursor: not-allowed; }
      .btn.ghost { background: #fff; color: #d14343; border: 1px solid #f3c1c1; }
      .muted { color: var(--muted); font-size: 12px; }
      input {
        width: 100%; padding: 10px; margin: 5px 0 12px; border: 1px solid var(--line);
        border-radius: 7px; font-size: 14px;
      }
      .msg { color: #d14343; font-size: 13px; margin-bottom: 8px; }
      .ok { color: #12864f; font-size: 13px; }
      .tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
      .tag.b { background: #e8f1ff; color: var(--blue); }
      .tag.c { background: #f3f4f6; color: var(--muted); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { padding: 9px 6px; text-align: left; border-bottom: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
