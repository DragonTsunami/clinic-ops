server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # hash 路由：只有 / 一个入口，不需要 try_files history 回退
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查透传（黑盒探测/巡检用完整链路验证）
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # nginx 自身指标（nginx-exporter 抓取；listen 127.0.0.1 不对外暴露）
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # clinic-net 桥接网段（exporter 容器来源）
        deny all;
    }

    location / {
        expires 1h;
        add_header Cache-Control "public";
    }
}
